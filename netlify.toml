# Netlify configuration for Parleys Full-Stack App

[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"
  functions = "backend/netlify/functions"
  [build.environment]
    PYTHON_VERSION = "3.11"

# Redirigir llamadas de API al backend serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Redirigir el resto de las rutas a index.html (React SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
